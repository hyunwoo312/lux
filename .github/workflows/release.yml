name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, verify and package without creating a release or uploading to the store"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Rebuild and verify dist is fresh
        run: |
          rm -rf dist
          npm run build
          test -f dist/manifest.json || { echo "dist/manifest.json missing after build"; exit 1; }
          test -f dist/index.html   || { echo "dist/index.html missing after build"; exit 1; }
          built=$(node -p "require('./dist/manifest.json').version")
          if [ "$built" != "$VERSION" ]; then
            echo "dist/manifest.json is $built but package.json is $VERSION"; exit 1
          fi
      - name: Verify packaged extension
        run: npm run verify:package
      - name: Verify release metadata
        run: npm run verify:release -- --strict
      - name: Package extension
        run: cd dist && zip -r "../lux-v${VERSION}.zip" . && cd ..
      - name: Generate release notes
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/gen-changelog.ts --release-body "v${VERSION}" > release-notes.md
      - name: Create GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" "lux-v${VERSION}.zip" --notes-file release-notes.md --target "${{ github.sha }}"
      - name: Require Chrome Web Store credentials
        if: inputs.dry_run != true
        run: |
          if [ -z "$CWS_CLIENT_ID" ]; then
            echo "CWS_CLIENT_ID is not set — the store upload would be skipped silently."
            echo "Set the secret, or run this workflow with dry_run: true."
            exit 1
          fi
      - name: Upload to Chrome Web Store (draft)
        if: inputs.dry_run != true
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: lux-v${{ env.VERSION }}.zip
          extension-id: kmfabjnibncbooljgbkinkfddapmfcna
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: false
